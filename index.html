<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Words</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#1f6feb;--ok:#1a7f4b;--no:#c4352b;--ln:#e4e1da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#202024;--tx:#f2f2f4;--mu:#9a9aa2;--ac:#5b9bff;--ok:#4cc38a;--no:#ff7a70;--ln:#33333a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#202024;--tx:#f2f2f4;--mu:#9a9aa2;--ac:#5b9bff;--ok:#4cc38a;--no:#ff7a70;--ln:#33333a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.st{color:var(--mu);font-size:13px;margin-bottom:12px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.nums{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:24px 20px;text-align:center}
.w{font-size:38px;font-weight:700;margin:6px 0 0;word-break:break-word}
.pos{color:var(--mu);font-size:14px;font-style:italic}
.d{margin:18px 0 8px;text-align:left}
.e{color:var(--mu);text-align:left;font-style:italic;margin:6px 0}
button{font:inherit;border:0;border-radius:12px;padding:14px 16px;cursor:pointer;color:#fff;background:var(--ac);width:100%;margin-top:14px}
button.sp{width:auto;display:inline-block;margin:10px 0 0;padding:10px 18px;background:var(--bg);color:var(--ac);border:1px solid var(--ln)}
.row{display:flex;gap:10px}.row button{flex:1}
.no{background:var(--no)}.ok{background:var(--ok)}
.hide{display:none}
input{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin-top:10px}
.lk{color:var(--ac);cursor:pointer;text-decoration:underline}
</style></head><body><main>
<h1>IELTS Words</h1>
<div class="st" id="st">Loading…</div>
<div class="bar"><i id="bar"></i></div>
<div class="nums"><span id="n1"></span><span id="n2"></span></div>
<div class="card" id="card"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
var SB_URL="https://vhcwdmiqchpfmvloqbro.supabase.co",SB_KEY="sb_publishable_T5rFi9FN21zyYsBSk6i11A_8Opf2Jcp"; // 
var W=[
["abandon","verb","If you abandon a place, thing, or person, you leave them permanently.","The villagers abandoned their homes because of the flood."],
["abundant","adjective","Something that is abundant exists in large quantities.","Fresh fruit is abundant in this region."],
["accommodate","verb","If a building accommodates someone, it provides enough space for them.","The hotel can accommodate up to 500 guests."],
["acquire","verb","If you acquire something, you buy or obtain it.","She acquired a large collection of books."],
["adequate","adjective","If something is adequate, there is enough of it or it is good enough.","Many students do not get adequate sleep."],
["advocate","verb","If you advocate a particular action, you recommend it publicly.","Doctors advocate a diet low in sugar."],
["alleviate","verb","If you alleviate pain or a problem, you make it less severe.","New roads will help alleviate traffic problems."],
["ambiguous","adjective","If something is ambiguous, it is unclear because it can be understood in more than one way.","His answer was ambiguous, so nobody knew what he meant."],
["appreciate","verb","If you appreciate something, you recognize that it is good or useful.","I appreciate your help with my essay."],
["attain","verb","If you attain something, you succeed in getting it, often after a lot of effort.","He attained a high score in the exam."],
["beneficial","adjective","Something that is beneficial helps people or improves their lives.","Regular exercise is beneficial to your health."],
["capacity","noun","The capacity of something is the amount that it can hold or produce.","The stadium has a capacity of 60,000."],
["circumstance","noun","The circumstances of a situation are the facts and conditions that affect it.","Under no circumstances should you open this door."],
["coherent","adjective","If something is coherent, it is clear and sensible, and its parts fit together well.","She gave a coherent explanation of her plan."],
["compensate","verb","To compensate for something means to reduce its bad effects.","Extra practice can compensate for a lack of talent."],
["comprehensive","adjective","Something that is comprehensive includes everything that is needed.","The book gives a comprehensive guide to the city."],
["consequence","noun","The consequences of something are the results or effects of it.","Pollution can have serious consequences for wildlife."],
["considerable","adjective","Considerable means large in amount or degree.","The project took a considerable amount of time."],
["contribute","verb","If you contribute to something, you give money, help, or ideas to it.","Everyone contributed to the success of the event."],
["controversial","adjective","If something is controversial, people disagree strongly about it.","The new law is highly controversial."],
["crucial","adjective","If something is crucial, it is extremely important.","Good communication is crucial in any team."],
["deteriorate","verb","If something deteriorates, it becomes worse.","His health deteriorated rapidly last winter."],
["diminish","verb","If something diminishes, it becomes smaller or less important.","The noise slowly diminished as the car drove away."],
["diverse","adjective","If a group of things is diverse, it contains many different kinds of things.","London is a diverse city with people from many cultures."],
["eliminate","verb","If you eliminate something, you completely get rid of it.","The company hopes to eliminate waste by 2030."],
["emerge","verb","When something emerges, it comes out or becomes known.","New evidence emerged during the investigation."],
["enhance","verb","To enhance something means to improve its quality or value.","Good lighting can enhance the look of a room."],
["evaluate","verb","If you evaluate something, you consider it carefully to decide how good it is.","Teachers evaluate students by using tests and projects."],
["fluctuate","verb","If something fluctuates, it changes a lot, rising and falling.","Prices fluctuate from month to month."],
["fundamental","adjective","Fundamental describes things that are very important and basic.","Clean water is a fundamental human need."],
["hinder","verb","If something hinders you, it makes it more difficult for you to do something.","Bad weather hindered the rescue team."],
["implement","verb","If you implement a plan, you put it into action.","The school implemented a new reading programme."],
["inevitable","adjective","If something is inevitable, it is certain to happen and cannot be avoided.","Change is inevitable in every society."],
["maintain","verb","If you maintain something, you keep it in good condition or continue it.","It is hard to maintain a healthy lifestyle when you are busy."],
["mitigate","verb","If you mitigate something bad, you make it less serious.","Trees help to mitigate the effects of heat in cities."],
["obtain","verb","If you obtain something, you get it.","You need to obtain a visa before you travel."],
["phenomenon","noun","A phenomenon is something that exists or happens and is interesting or unusual.","Climate change is a global phenomenon."],
["predominantly","adverb","You use predominantly to say that something is mostly true.","The area is predominantly rural."],
["reluctant","adjective","If you are reluctant to do something, you do not want to do it.","Many people are reluctant to change jobs."],
["substantial","adjective","Substantial means large in amount or importance.","The company made a substantial profit."],
["sustainable","adjective","Something that is sustainable can continue for a long time without causing damage.","We need sustainable sources of energy."],
["tackle","verb","If you tackle a problem, you try to deal with it.","The government plans to tackle unemployment."],
["vulnerable","adjective","Someone who is vulnerable can be easily harmed or hurt.","Young children are vulnerable to infection."]
];
var KEY="ielts_progress_v1",P={},ref=null,cur=-1,shown=false,chain=Promise.resolve();
var STEP=[600000,86400000,259200000,604800000,1814400000];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;
 var v=speechSynthesis.getVoices().filter(function(x){return /^en[-_]GB/i.test(x.lang)})[0]||speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang)})[0];
 if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
var sb=null,uid=null;
function save(){
 try{localStorage.setItem(KEY+uid,JSON.stringify(P))}catch(e){}
 if(sb&&uid){var d=JSON.parse(JSON.stringify(P));
  chain=chain.then(function(){return sb.from("progress").upsert({user_id:uid,data:d,updated_at:new Date().toISOString()})})
  .then(function(r){if(r&&r.error)throw r.error}).catch(function(){$("st").textContent="云端保存失败，请检查网络"})}
}
function next(){
 var now=Date.now(),best=-1,bd=1e18,i;
 for(i=0;i<W.length;i++){var r=P[W[i][0]];if(r&&r.due<=now&&r.due<bd){bd=r.due;best=i}}
 if(best<0)for(i=0;i<W.length;i++)if(!P[W[i][0]]){best=i;break}
 return best}
function stats(){
 var seen=0,mast=0;W.forEach(function(w){var r=P[w[0]];if(r){seen++;if(r.box>=3)mast++}});
 $("bar").style.width=(mast/W.length*100)+"%";
 $("n1").textContent="Learned "+seen+" / "+W.length;$("n2").textContent="Mastered "+mast}
function render(){
 stats();cur=next();shown=false;var c=$("card");
 if(cur<0){c.innerHTML='<div class="w">All done!</div><p class="d">No words are due right now. Come back later to review.</p>';return}
 var w=W[cur];
 c.innerHTML='<div class="pos">'+w[1]+'</div><div class="w">'+esc(w[0])+'</div>'+
 '<button class="sp" id="sp1">🔊 Listen</button>'+
 '<button id="rv">Show meaning</button>'+
 '<div id="ans" class="hide"><p class="d">'+esc(w[2])+'</p><p class="e">“'+esc(w[3])+'”</p>'+
 '<button class="sp" id="sp2">🔊 Listen to example</button>'+
 '<div class="row"><button class="no" id="bn">Forgot</button><button class="ok" id="by">Know it</button></div></div>';
 $("sp1").onclick=function(){speak(w[0])};
 $("sp2").onclick=function(){speak(w[3])};
 $("rv").onclick=function(){$("rv").className="hide";$("ans").className="";speak(w[0])};
 $("bn").onclick=function(){grade(w[0],false)};
 $("by").onclick=function(){grade(w[0],true)}}
function grade(k,ok){
 var r=P[k]||{box:0},now=Date.now();
 if(ok){r.box=Math.min(r.box+1,4);r.due=now+STEP[r.box]}else{r.box=0;r.due=now+60000}
 P[k]=r;save();render()}
function showAuth(msg){
 uid=null;P={};stats();
 $("st").textContent="请登录后开始背单词";
 $("card").innerHTML='<div class="w" style="font-size:26px">Sign in</div>'+
 '<input id="em" type="email" placeholder="邮箱" autocomplete="username">'+
 '<input id="pw" type="password" placeholder="密码（至少6位）" autocomplete="current-password">'+
 '<button id="li">登录</button><button class="sp" id="su" style="width:100%">注册新账号</button>'+
 '<p class="e" id="msg" style="text-align:center">'+(msg||"")+'</p>';
 function go(up){var e=$("em").value.trim(),p=$("pw").value;if(!e||p.length<6){$("msg").textContent="请输入邮箱和至少6位密码";return}
  $("msg").textContent="请稍候…";
  (up?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p})).then(function(r){
   if(r.error){$("msg").textContent=r.error.message;return}
   if(r.data.session)start(r.data.session);else $("msg").textContent="注册成功，请到邮箱点击确认链接后再登录"})}
 $("li").onclick=function(){go(false)};$("su").onclick=function(){go(true)}}
function start(sess){
 uid=sess.user.id;P={};
 try{var s=JSON.parse(localStorage.getItem(KEY+uid)||"null");if(s)P=s}catch(e){}
 $("st").innerHTML="已登录："+esc(sess.user.email)+" · 进度已云端同步 · <span class='lk' id='lo'>退出</span>";
 $("lo").onclick=function(){sb.auth.signOut().then(function(){showAuth()})};
 render();
 sb.from("progress").select("data").eq("user_id",uid).maybeSingle().then(function(r){
  if(r.error){$("st").textContent="读取云端进度失败，请检查网络";return}
  if(r.data&&r.data.data){var c=r.data.data;Object.keys(c).forEach(function(k){if(!P[k]||c[k].due>P[k].due)P[k]=c[k]})}
  save();render()})}
function load(){
 if(!SB_URL||!SB_KEY){$("st").textContent="请先在文件顶部填写 SB_URL 和 SB_KEY";return}
 sb=supabase.createClient(SB_URL,SB_KEY);
 sb.auth.getSession().then(function(r){r.data.session?start(r.data.session):showAuth()})}
try{speechSynthesis.getVoices()}catch(e){}
load();
</script></body></html>
